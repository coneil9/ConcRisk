[project]
name = "concrisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carter O'Neil", email = "carterrossoneil@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
