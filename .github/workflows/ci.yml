name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: concrisk
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: concrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concrisk -d concrisk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://concrisk:localdev@localhost:5432/concrisk
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Alembic migrate (baseline)
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -q
